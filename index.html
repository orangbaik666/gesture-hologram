<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Gesture Engine</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>



    <div class="container">

        <!-- LEFT SIDE -->
        <div class="camera-section">
            <div id="handAura" class="hand-aura"></div>

            <video id="webcam" autoplay playsinline></video>

            <canvas id="output"></canvas>
            <canvas id="particles"></canvas>
            <div id="virtualCursor"></div>

            <div class="overlay">

                <h1>AI GESTURE ENGINE</h1>

                <p id="status">
                    Initializing...
                </p>

                <div class="controls">

                    <button id="recordBtn">
                        RECORD GESTURE
                    </button>

                    <button id="mouseBtn">
                        MOUSE MODE OFF
                    </button>

                    <button id="drawBtn">
                        DRAW MODE OFF
                    </button>

                </div>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="result-section">

            <div id="hologram" class="hidden">

                <div class="scanline"></div>

                <div class="hologram-content">
                    READY
                </div>

                <div class="corner corner-top-left"></div>
                <div class="corner corner-top-right"></div>
                <div class="corner corner-bottom-left"></div>
                <div class="corner corner-bottom-right"></div>

            </div>

            <!-- WHITEBOARD PANEL -->
            <div id="whiteboardPanel" class="hidden">

                <div class="wb-header">
                    <h2>WHITEBOARD</h2>
                    <button id="clearBoardBtn">CLEAR</button>
                </div>

                <div class="wb-canvas-wrapper">
                    <canvas id="whiteboardCanvas"></canvas>
                    <div id="wbCursor"></div>
                </div>

                <div class="wb-tools">

                    <div class="wb-colors">
                        <div class="wb-color active" data-color="#00ffff" style="background:#00ffff"></div>
                        <div class="wb-color" data-color="#ff00ff" style="background:#ff00ff"></div>
                        <div class="wb-color" data-color="#ffffff" style="background:#ffffff"></div>
                        <div class="wb-color" data-color="#ffff00" style="background:#ffff00"></div>
                        <div class="wb-color" data-color="#ff6b35" style="background:#ff6b35"></div>
                    </div>

                    <div class="wb-sizes">
                        <button class="wb-size active" data-size="3">S</button>
                        <button class="wb-size" data-size="7">M</button>
                        <button class="wb-size" data-size="14">L</button>
                    </div>

                </div>

                <div class="wb-hint">
                    <span>👌 PINCH = DRAW &nbsp;|&nbsp; ✋ OPEN = LIFT</span>
                </div>

            </div>

            <div id="gesturePanel">

                <h2>SAVED GESTURES</h2>

                <div id="gestureList"></div>

            </div>

            <div id="scannerPanel">

                <h2>AI CONFIDENCE</h2>

                <div class="confidence-bar">

                    <div id="confidenceFill"></div>

                </div>

                <div id="confidenceText">
                    0%
                </div>

                <div id="gestureMatch">
                    MATCHING: NONE
                </div>

                <div id="aiStatus">
                    STATUS: IDLE
                </div>

            </div>

        </div>

        <div id="handAura"></div>

    </div>



    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script src="script.js"></script>

</body>

</html>
